version: '3.8'

services:

  evolution-api:

    image: atendai/evolution-api:latest

    container_name: evolution-api

    restart: always

    ports:
      - "8080:8080"

    environment:

      AUTHENTICATION_API_KEY: evolution123

      SERVER_TYPE: http

      SERVER_PORT: 8080

      DEL_INSTANCE: false

    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
